<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synapse Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#080f19;color:#e7eef6;font:14px system-ui;padding:26px}main{max-width:1400px;margin:auto}header{display:flex;gap:22px;align-items:center;border-bottom:1px solid #233243;padding-bottom:18px;flex-wrap:wrap}b{font-size:19px;letter-spacing:2px;color:#52d6c4}.status{margin-left:auto;color:#9cb0c2}button{background:#132130;border:1px solid #2a3c4d;color:#dce8f2;padding:9px 15px;border-radius:6px;cursor:pointer;margin-left:5px}button:first-child{background:#1e766e}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:20px 0}.metrics article,.world{background:#0d1723;border:1px solid #1c2c3b;border-radius:9px;padding:16px}.metrics small{display:block;color:#8295a8}.metrics strong{display:block;margin-top:8px;font-size:25px}.world{padding:18px}canvas{width:100%;height:auto;display:block;background:#07111d}footer{padding-top:12px;color:#91a4b7;font-size:11px}@media(max-width:800px){.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:450px){.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><header><b>◉ SYNAPSE</b><span>ARTIFICIAL LIFE LAB</span><span class="status" id="status">PAUSED · TICK 0</span><nav><button onclick="action('start')">Run</button><button onclick="action('pause')">Pause</button><button onclick="action('step')">Step</button><button onclick="action('reset')">Reset</button></nav></header><section class="metrics" id="metrics"></section><section class="world"><div>LIVE ECOSYSTEM <small>800 × 600 units · seed 42</small></div><canvas id="world" width="1000" height="750"></canvas><footer>● Herbivore　● Predator　● Food</footer></section></main><script>let state;const labels={population:'Organisms',herbivores:'Herbivores',predators:'Predators',food:'Food',births:'Births',mean_energy:'Mean energy'};function draw(s){state=s;document.querySelector('#status').textContent=(window.running?'RUNNING':'PAUSED')+' · TICK '+s.tick;document.querySelector('#metrics').innerHTML=Object.entries(labels).map(([k,v])=>`<article><small>${v}</small><strong>${s.metrics[k]??'—'}</strong></article>`).join('');const c=document.querySelector('#world'),x=c.getContext('2d');x.fillStyle='#07111d';x.fillRect(0,0,c.width,c.height);for(const [a,b] of s.food){x.fillStyle='#a4e56c';x.fillRect(a*1.25,b*1.25,4,4)}for(const o of s.organisms){x.beginPath();x.fillStyle=o.species==='predator'?'#ff6b72':'#52d6c4';x.arc(o.x*1.25,o.y*1.25,o.species==='predator'?5:3.5,0,7);x.fill()}}async function action(a){await fetch('/simulation/'+a,{method:'POST'});window.running=a==='start';if(a==='step'||a==='reset')draw(await(await fetch('/simulation/state')).json())}function connect(){const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/simulation/stream');w.onmessage=e=>draw(JSON.parse(e.data));w.onclose=()=>setTimeout(connect,1000)}fetch('/simulation/state').then(r=>r.json()).then(draw);connect();</script></body></html>
